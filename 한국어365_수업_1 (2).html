<style>
  :root{
    --ink:#132022; --celadon:#1F3D3F; --celadon-2:#2C5457;

  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--stone-2);color:var(--ink);font-family:'Noto Sans KR','PT Sans',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  h1,h2,h3{font-family:'Noto Serif KR','PT Serif',serif;font-weight:700;letter-spacing:-0.01em;}
  .ru{font-family:'PT Serif',serif;}
  button{font-family:inherit;cursor:pointer;}

  #app{max-width:820px;margin:0 auto;min-height:100vh;background:var(--paper);box-shadow:0 0 60px rgba(19,32,34,0.08);}
  .topbar{padding:18px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;}
  .brand-seal{width:32px;height:32px;border:1.5px solid var(--seal);border-radius:3px;display:flex;align-items:center;justify-content:center;color:var(--seal);font-weight:700;font-size:13px;transform:rotate(-4deg);}
  .brand-text{font-size:15px;font-weight:700;}

  main{padding:0;min-height:60vh;}
  .container{padding:32px 28px;}
  @media (max-width:600px){.container{padding:24px 18px;}.topbar{padding:14px 16px;}}

  .day-hero{padding:36px 28px 24px;border-bottom:1px solid var(--line);background:var(--stone-2);}
  .day-hero .tag{font-size:11px;letter-spacing:.1em;color:var(--seal);text-transform:uppercase;}
  .day-hero h2{font-size:26px;margin:6px 0 4px;}
  .day-hero .ru{font-size:14px;color:var(--celadon);}
  .done-badge{margin-top:12px;display:inline-block;font-size:12.5px;background:var(--celadon);color:#fff;padding:5px 12px;border-radius:3px;}

  .sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;}
  .sec-head .no{font-family:'Noto Serif KR',serif;color:var(--seal);font-weight:700;font-size:13px;}
  .sec-head h3{font-size:17px;margin:0;}
  .sec-head .ru{font-size:12px;color:var(--celadon-2);margin-left:auto;}

  .video-wrap{position:relative;width:100%;padding-top:56.25%;border-radius:3px;overflow:hidden;background:#000;}
  .video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}

  .empty-block{padding:20px;border:1px dashed var(--line);border-radius:3px;font-size:13px;color:#8a938f;text-align:center;}

  .hw-list{margin:0;padding-left:20px;}
  .hw-list li{font-size:14.5px;line-height:1.9;}

  .btn{padding:13px 26px;border-radius:2px;font-size:14px;font-weight:700;border:1px solid var(--ink);background:var(--ink);color:var(--paper);}
  .btn.seal{background:var(--seal);border-color:var(--seal);color:#fff;}
  .btn.outline{background:transparent;color:var(--ink);}

  .quiz-wrap{padding:32px 28px 48px;}
  .quiz-progress{font-size:12px;color:var(--celadon-2);margin-bottom:10px;}
  .quiz-q{font-size:18px;font-weight:700;margin-bottom:20px;}
  .quiz-opts{display:grid;gap:10px;margin-bottom:20px;}
  .quiz-opt{text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:3px;background:#fff;font-size:14.5px;}
  .quiz-opt:hover{border-color:var(--celadon-2);}
  .quiz-opt.correct{border-color:var(--celadon);background:rgba(31,61,63,0.07);}
  .quiz-opt.wrong{border-color:var(--seal);background:rgba(179,38,30,0.06);}
  .quiz-feedback{font-size:13.5px;padding:12px 14px;border-left:3px solid var(--gold);background:var(--stone-2);margin-bottom:16px;display:none;}
  .quiz-result{text-align:center;padding:30px 0;}
  .quiz-result .stamp-big{width:110px;height:110px;border:3px solid var(--seal);color:var(--seal);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;transform:rotate(-6deg);}
  .quiz-result .stamp-big span{font-family:'Noto Serif KR',serif;font-weight:700;font-size:22px;}

  .gate{max-width:420px;margin:80px auto;text-align:center;padding:0 20px;}
  .gate-seal{width:56px;height:56px;border:2px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:22px;color:#8a938f;}
  .gate h2{font-size:19px;margin:0 0 8px;}
  .gate .ru{font-size:13px;color:var(--celadon-2);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:3px;font-size:13px;opacity:0;transition:all .25s ease;pointer-events:none;z-index:100;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

/* ============ URL에서 day 파라미터 읽기 ============ */
function getDayFromUrl(){
  const params = new URLSearchParams(window.location.search);
  const d = parseInt(params.get('day'), 10);
  if(d >= 1 && d <= 30) return d;
  return null;
}

/* ============ 진도 저장 (이 날짜만) ============ */
function stateKey(d){ return `classroom-day-${d}`; }
function loadDayState(d){
  try{
    const raw = localStorage.getItem(stateKey(d));
    return raw ? JSON.parse(raw) : {done:false, score:null};
  }catch(e){ return {done:false, score:null}; }
}
function saveDayState(d, state){
  try{ localStorage.setItem(stateKey(d), JSON.stringify(state)); }catch(e){}
}

/* ============ 유튜브 URL -> 임베드 URL 변환 ============ */
function toYoutubeEmbed(url){
  if(!url) return null;
  let id = null;
  const patterns = [
    /youtu\.be\/([a-zA-Z0-9_-]+)/,
    /youtube\.com\/watch\?v=([a-zA-Z0-9_-]+)/,
    /youtube\.com\/embed\/([a-zA-Z0-9_-]+)/,
    /youtube\.com\/shorts\/([a-zA-Z0-9_-]+)/,
  ];
  for(const p of patterns){
    const m = url.match(p);
    if(m){ id = m[1]; break; }
  }
  if(!id && /^[a-zA-Z0-9_-]{6,}$/.test(url.trim())) id = url.trim(); // 영상 ID만 입력한 경우
  return id ? `https://www.youtube.com/embed/${id}` : null;
}

function startQuiz(d){
  QUIZ_IDX = 0; QUIZ_SCORE = 0; QUIZ_ANSWERED = false;
  renderQuizStep(d);
}

function renderQuizStep(d){
  const questions = QUIZ_BANK[d];
  const [kr, ru] = DAY_TITLES[d] || ["",""];

  if(QUIZ_IDX >= questions.length){
    const pct = Math.round(QUIZ_SCORE/questions.length*100);
    saveDayState(d, {done:true, score:QUIZ_SCORE});
    document.getElementById('main').innerHTML = `
    <section class="day-hero">
      <div class="tag">DAY ${d}</div>
      <h2>${kr}</h2>
      <div class="ru">${ru}</div>
    </section>
    <section class="quiz-wrap">
      <div class="quiz-result">
        <div class="stamp-big"><span>${QUIZ_SCORE}/${questions.length}</span></div>
        <h2 style="margin:0 0 6px;">퀴즈 완료!</h2>
        <p class="ru" style="color:var(--celadon-2);">Результат: ${pct}%</p>
        <div style="margin-top:24px;display:flex;gap:12px;justify-content:center;">
          <button class="btn seal" onclick="renderDayPage(${d})">돌아가기</button>
          <button class="btn outline" onclick="startQuiz(${d})">다시 풀기</button>
        </div>
      </div>
    </section>`;
    return;
  }
  const q = questions[QUIZ_IDX];
  const opts = q.opts.map((o,i)=>`<button class="quiz-opt" id="opt${i}" onclick="answerQuiz(${d},${i})">${o}</button>`).join('');
  document.getElementById('main').innerHTML = `
  <section class="day-hero">
    <div class="tag">DAY ${d}</div>
    <h2>${kr}</h2>
    <div class="ru">${ru}</div>
  </section>
  <section class="quiz-wrap">
    <div class="quiz-progress">${QUIZ_IDX+1} / ${questions.length}</div>
    <div class="quiz-q">${q.q}</div>
    <div class="quiz-opts">${opts}</div>
    <div class="quiz-feedback" id="quizFeedback"></div>
  </section>`;
}

function answerQuiz(d, i){
  if(QUIZ_ANSWERED) return;
  QUIZ_ANSWERED = true;
  const q = QUIZ_BANK[d][QUIZ_IDX];
  const correct = i === q.a;
  if(correct) QUIZ_SCORE++;
  document.querySelectorAll('.quiz-opt').forEach((btn,idx)=>{
    if(idx===q.a) btn.classList.add('correct');
    if(idx===i && !correct) btn.classList.add('wrong');
  });
  const fb = document.getElementById('quizFeedback');
  fb.style.display = 'block';
  fb.textContent = correct ? '정답입니다! · Правильно!' : `오답이에요. 정답: ${q.opts[q.a]}`;
  setTimeout(()=>{ QUIZ_IDX++; QUIZ_ANSWERED = false; renderQuizStep(d); }, 1000);
}

/* ============ 복습 숙제 퀴즈 (객관식) 상태 ============ */
function hwStateKey(d){ return `classroom-day-${d}-hw`; }
function loadHwState(d){
  try{
    const raw = localStorage.getItem(hwStateKey(d));
    return raw ? JSON.parse(raw) : {done:false, score:null};
  }catch(e){ return {done:false, score:null}; }
}
function saveHwState(d, state){
  try{ localStorage.setItem(hwStateKey(d), JSON.stringify(state)); }catch(e){}
}

let HW_IDX = 0, HW_SCORE = 0, HW_ANSWERED = false;

function startHwQuiz(d){
  HW_IDX = 0; HW_SCORE = 0; HW_ANSWERED = false;
  renderHwQuizStep(d);
}

function renderHwQuizStep(d){
  const questions = DAY_HOMEWORK_QUIZ[d];
  const [kr, ru] = DAY_TITLES[d] || ["",""];

  if(HW_IDX >= questions.length){
    const pct = Math.round(HW_SCORE/questions.length*100);
    saveHwState(d, {done:true, score:HW_SCORE});
    document.getElementById('main').innerHTML = `
    <section class="day-hero">
      <div class="tag">DAY ${d} · 복습 퀴즈</div>
      <h2>${kr}</h2>
      <div class="ru">${ru}</div>
    </section>
    <section class="quiz-wrap">
      <div class="quiz-result">
        <div class="stamp-big"><span>${HW_SCORE}/${questions.length}</span></div>
        <h2 style="margin:0 0 6px;">복습 퀴즈 완료!</h2>
        <p class="ru" style="color:var(--celadon-2);">Результат: ${pct}%</p>
        <div style="margin-top:24px;display:flex;gap:12px;justify-content:center;">
          <button class="btn seal" onclick="renderDayPage(${d})">돌아가기</button>
          <button class="btn outline" onclick="startHwQuiz(${d})">다시 풀기</button>
        </div>
      </div>
    </section>`;
    return;
  }
  const q = questions[HW_IDX];
  const opts = q.opts.map((o,i)=>`<button class="quiz-opt" id="hwopt${i}" onclick="answerHwQuiz(${d},${i})">${o}</button>`).join('');
  document.getElementById('main').innerHTML = `
  <section class="day-hero">
    <div class="tag">DAY ${d} · 복습 퀴즈</div>
    <h2>${kr}</h2>
    <div class="ru">${ru}</div>
  </section>
  <section class="quiz-wrap">
    <div class="quiz-progress">${HW_IDX+1} / ${questions.length}</div>
    <div class="quiz-q">${q.q}</div>
    <div class="quiz-opts">${opts}</div>
    <div class="quiz-feedback" id="hwFeedback"></div>
  </section>`;
}

function answerHwQuiz(d, i){
  if(HW_ANSWERED) return;
  HW_ANSWERED = true;
  const q = DAY_HOMEWORK_QUIZ[d][HW_IDX];
  const correct = i === q.a;
  if(correct) HW_SCORE++;
  document.querySelectorAll('.quiz-opt').forEach((btn,idx)=>{
    if(idx===q.a) btn.classList.add('correct');
    if(idx===i && !correct) btn.classList.add('wrong');
  });
  const fb = document.getElementById('hwFeedback');
  fb.style.display = 'block';
  fb.textContent = correct ? 'Правильно!' : `Неверно. Правильный ответ: ${q.opts[q.a]}`;
  setTimeout(()=>{ HW_IDX++; HW_ANSWERED = false; renderHwQuizStep(d); }, 1000);
}

/* ============ INIT ============ */
(function init(){
  const d = getDayFromUrl();
  if(d === null){ renderNoAccess(); return; }
  ACTIVE_DAY = d;
  renderDayPage(d);
})();

</script>
</body>
</html>
